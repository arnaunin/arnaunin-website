# Configuració de Netlify. Vegeu el README per connectar el repositori.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"
  # Netlify detecta pnpm pel fitxer pnpm-lock.yaml.

# Pàgina 404 en l'idioma de cada secció (la catalana és la general).
[[redirects]]
  from = "/es/*"
  to = "/es/404/"
  status = 404

[[redirects]]
  from = "/en/*"
  to = "/en/404/"
  status = 404

# Seguretat bàsica per a totes les pàgines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Fitxers amb empremta al nom: es poden guardar a la memòria cau un any.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
